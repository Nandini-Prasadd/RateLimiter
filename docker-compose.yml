version: '3.8'

services:
  # Distributed state storage layer
  redis:
    image: redis:alpine
    container_name: rl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  # Simulated backend service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rl-backend
    command: ./backend_simulator
    ports:
      - "8081:8081"
    restart: unless-stopped

  # Rate limiter proxy instance 1
  proxy1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rl-proxy-1
    command: ./rate_limiter_proxy
    ports:
      - "8080:8080"
    environment:
      - CONFIG_FILE=config/docker.json
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # Rate limiter proxy instance 2 (shares quota with proxy 1)
  proxy2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rl-proxy-2
    command: ./rate_limiter_proxy
    ports:
      - "8082:8080"
    environment:
      - CONFIG_FILE=config/docker.json
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
